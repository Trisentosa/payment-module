# Infrastructure for the end-to-end tests (make e2e). Separate project and ports from the
# dev stack in the repo root, so the two can run side by side.
name: paygate-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paygate_e2e
      POSTGRES_USER: paygate_user
      POSTGRES_PASSWORD: secret
    ports: ["55433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paygate_user -d paygate_e2e"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_VHOST: paygate
    ports: ["55672:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 30
